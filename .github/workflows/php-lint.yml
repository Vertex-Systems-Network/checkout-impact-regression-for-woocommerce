name: Plugin CI and installable build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate, test and package plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Read and validate plugin version
        id: plugin
        shell: bash
        run: |
          version="$(sed -n 's/^ \* Version: *//p' wpessential-checkout-impact-regression.php | head -n 1 | tr -d '\r')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Could not read a valid plugin version from the main plugin header."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building plugin version $version"

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Generate optimized PSR-4 autoloader
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev --optimize-autoloader

      - name: Lint PHP source and generated Composer files
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './.git/*' -not -path './dist/*' -print0)

      - name: Check admin JavaScript syntax
        run: node --check assets/js/admin.js

      - name: Run pure normalization, scenario, multilingual context and privacy contract checks
        run: |
          php tests/php/normalizer-diff.php
          php tests/php/manual-comparison-contract.php
          php tests/php/scenario-contract.php
          php tests/php/multilingual-context-dry-run.php
          php tests/php/privacy-contract.php
          php tests/php/payload-privacy-contract.php
          php tests/php/schema-contract.php
          php tests/php/change-event-contract.php
          php tests/php/uninstall-contract.php preserve
          php tests/php/uninstall-contract.php erase
          php tests/php/retention-purge-contract.php
          php tests/php/rest-route-contract.php
          php tests/php/retention-scheduler-contract.php
          php tests/php/baseline-approval-contract.php
          php tests/php/dependency-admin-contract.php

      - name: Build and verify installable plugin ZIP
        shell: bash
        env:
          PLUGIN_VERSION: ${{ steps.plugin.outputs.version }}
        run: |
          slug="wpessential-checkout-impact-regression"
          package_dir="dist/$slug"
          zip_path="dist/$slug-${PLUGIN_VERSION}.zip"

          rm -rf "$package_dir"
          mkdir -p "$package_dir"
          cp -R wpessential-checkout-impact-regression.php uninstall.php assets includes vendor "$package_dir/"

          test -f "$package_dir/vendor/autoload.php"
          test -f "$package_dir/wpessential-checkout-impact-regression.php"

          (
            cd dist
            zip -qr "$(basename "$zip_path")" "$slug"
            unzip -t "$(basename "$zip_path")"
            unzip -Z1 "$(basename "$zip_path")" | grep -qx "$slug/wpessential-checkout-impact-regression.php"
            unzip -Z1 "$(basename "$zip_path")" | grep -qx "$slug/vendor/autoload.php"
            sha256sum "$(basename "$zip_path")" > "$(basename "$zip_path").sha256"
          )

          rm -rf "$package_dir"
          echo "Install this ZIP from WordPress Admin → Plugins → Add Plugin → Upload Plugin."
          ls -lh "$zip_path" "$zip_path.sha256"

      - name: Upload downloadable install package
        uses: actions/upload-artifact@v4
        with:
          name: installable-plugin-v${{ steps.plugin.outputs.version }}
          path: |
            dist/wpessential-checkout-impact-regression-${{ steps.plugin.outputs.version }}.zip
            dist/wpessential-checkout-impact-regression-${{ steps.plugin.outputs.version }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
