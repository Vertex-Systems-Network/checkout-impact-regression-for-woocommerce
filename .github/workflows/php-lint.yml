name: PHP lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    name: Composer autoload and PHP syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Generate optimized PSR-4 autoloader
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev --optimize-autoloader

      - name: Lint PHP source and generated Composer files
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)

      - name: Check admin JavaScript syntax
        run: node --check assets/js/admin.js

      - name: Build installable plugin ZIP with Composer vendor files
        shell: bash
        run: |
          package_dir="dist/wpessential-checkout-impact-regression"
          mkdir -p "$package_dir"
          cp -R wpessential-checkout-impact-regression.php uninstall.php assets includes vendor "$package_dir/"
          (
            cd dist
            zip -qr wpessential-checkout-impact-regression-0.2.0.zip wpessential-checkout-impact-regression
            unzip -t wpessential-checkout-impact-regression-0.2.0.zip
          )

      - name: Upload installable plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: wpessential-checkout-impact-regression-0.2.0
          path: dist/wpessential-checkout-impact-regression-0.2.0.zip
          if-no-files-found: error
