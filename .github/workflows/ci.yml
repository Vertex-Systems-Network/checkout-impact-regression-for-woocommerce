name: CI, Pro compatibility, Plugin Check and packages

# The free plugin and Pro live in separate repositories but ship together.
# Every run checks the free plugin against Pro (same-named branch if it exists,
# otherwise main): Pro's compatibility contract, Pro's tests and a combined
# WordPress Playground integration run.
#
# This repository is public, so it NEVER uploads a Pro ZIP or Pro build: Pro is
# checked out and tested inside the job only. Pro packages are built and kept in
# the private Pro repository. Reading the private Pro repository needs the
# PRO_REPO_TOKEN secret (fine-grained token, Contents: read on the Pro repo);
# without it (for example on pull requests from forks) the Pro jobs are skipped.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [pro-updated]
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

env:
  PRO_REPO: Vertex-Systems-Network/checkout-impact-regression-pro-for-woocommerce

jobs:
  test:
    name: Lint and contract tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Validate Composer and build autoloader
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress --no-dev --optimize-autoloader
      - name: Lint PHP
        run: find . -type f -name '*.php' -not -path './.git/*' -not -path './dist/*' -not -path './build/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Check JavaScript syntax
        run: node --check assets/js/admin.js
      - name: readme.txt is generated from wordpress-org/readme.md
        run: php tools/readme-to-txt.php --check
      - name: Run contract tests
        shell: bash
        run: |
          set -e
          for test in tests/php/*-contract.php tests/php/normalizer-diff.php tests/php/multilingual-context-dry-run.php; do
            case "$test" in
              *uninstall-contract.php) php "$test" preserve; php "$test" erase ;;
              *) php "$test" ;;
            esac
          done

  pro-compat:
    name: Pro compatibility (contract + Pro tests)
    runs-on: ubuntu-latest
    outputs:
      pro_sha: ${{ steps.ref.outputs.sha }}
      available: ${{ steps.ref.outputs.available }}
    steps:
      - uses: actions/checkout@v4
      - id: ref
        name: Pick the Pro commit (same-named branch, else main)
        shell: bash
        env:
          TOKEN: ${{ secrets.PRO_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "PRO_REPO_TOKEN is not available; Pro compatibility jobs skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          url="https://x-access-token:${TOKEN}@github.com/$PRO_REPO"
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          sha=$(git ls-remote "$url" "refs/heads/$branch" | cut -f1)
          [ -n "$sha" ] || sha=$(git ls-remote "$url" refs/heads/main | cut -f1)
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Testing against $PRO_REPO@$sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: steps.ref.outputs.available == 'true'
        with:
          repository: ${{ env.PRO_REPO }}
          ref: ${{ steps.ref.outputs.sha }}
          token: ${{ secrets.PRO_REPO_TOKEN }}
          path: pro-repo
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        if: steps.ref.outputs.available == 'true'
        with:
          php-version: '8.3'
          coverage: none
      - name: Pro still works with this free plugin
        if: steps.ref.outputs.available == 'true'
        run: |
          FREE_DIR="$GITHUB_WORKSPACE" php pro-repo/tests/free-api-contract.php
          php pro-repo/tests/pro-contract.php
          node --check pro-repo/assets/pro.js

  package:
    name: Build the free ZIP
    needs: [test, pro-compat]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Build the free package (Pro packages are built only in the private Pro repository)
        run: ./bin/build.sh
      - name: Upload the free package
        uses: actions/upload-artifact@v4
        with:
          name: free-plugin-package
          path: |
            dist/checkout-impact-regression-for-woocommerce-*.zip
            dist/checkout-impact-regression-for-woocommerce-*.zip.sha256
          if-no-files-found: error
      - name: Keep the unpacked free build for Plugin Check and integration
        uses: actions/upload-artifact@v4
        with:
          name: free-build
          path: build/checkout-impact-regression-for-woocommerce
          retention-days: 3

  plugin-check:
    name: WordPress.org Plugin Check (free plugin)
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: free-build
          path: checkout-impact-regression-for-woocommerce
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./checkout-impact-regression-for-woocommerce
          slug: checkout-impact-regression-for-woocommerce

  integration:
    name: Free + Pro together in WordPress Playground (PHP ${{ matrix.php }})
    needs: [package, pro-compat]
    if: needs.pro-compat.outputs.available == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: free-build
          path: free-build
      - name: Check out Pro (in this job only; never uploaded)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRO_REPO }}
          ref: ${{ needs.pro-compat.outputs.pro_sha }}
          token: ${{ secrets.PRO_REPO_TOKEN }}
          path: pro-repo
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Pro locally and run the integration check (latest WordPress + WooCommerce)
        run: |
          (cd pro-repo && ./bin/build.sh --pro-only >/dev/null)
          pro-repo/tests/integration/run.sh free-build pro-repo/build/checkout-impact-regression-pro-for-woocommerce ${{ matrix.php }}

  notify-pro:
    name: Ask the Pro repository to re-test
    needs: [package, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch free-updated to Pro (needs CROSS_REPO_TOKEN secret)
        env:
          TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "CROSS_REPO_TOKEN not set; Pro re-tests on its nightly schedule instead." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$PRO_REPO/dispatches" \
            -d "{\"event_type\":\"free-updated\",\"client_payload\":{\"sha\":\"$GITHUB_SHA\"}}"
