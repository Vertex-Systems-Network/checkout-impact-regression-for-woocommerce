name: Deploy free plugin to WordPress.org

# Runs only after the plugin has been approved on WordPress.org and the
# SVN_USERNAME / SVN_PASSWORD repository secrets have been added.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Install production autoloader
        run: composer install --no-interaction --no-dev --optimize-autoloader
      - name: Deploy to WordPress.org SVN
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: checkout-impact-regression-for-woocommerce
          ASSETS_DIR: wordpress-org
