name: Deploy free plugin to WordPress.org

# Runs only after the plugin has been approved on WordPress.org and the
# SVN_USERNAME / SVN_PASSWORD secrets have been added. Actions that receive
# the SVN credentials are pinned to full commit SHAs.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Build the same allowlisted package that CI and Plugin Check use
        run: ./bin/build.sh
      - name: Deploy to WordPress.org SVN
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: checkout-impact-regression-for-woocommerce
          BUILD_DIR: build/checkout-impact-regression-for-woocommerce
          ASSETS_DIR: wordpress-org
